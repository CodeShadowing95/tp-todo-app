apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../../

images:
  - name: todo-backend
    newName: REPLACE_WITH_ACR_LOGIN_SERVER/todo-backend
    newTag: latest
  - name: todo-auth
    newName: REPLACE_WITH_ACR_LOGIN_SERVER/todo-auth
    newTag: latest
  - name: todo-client
    newName: REPLACE_WITH_ACR_LOGIN_SERVER/todo-client
    newTag: latest
  - name: todo-gateway
    newName: REPLACE_WITH_ACR_LOGIN_SERVER/todo-gateway
    newTag: latest

commonAnnotations:
  deployment.target: azure-aks
