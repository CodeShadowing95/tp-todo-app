apiVersion: v1
kind: ConfigMap
metadata:
  name: app-config
  namespace: todo-app
data:
  # Backend configuration
  BACKEND_PORT: "3000"
  NODE_ENV: production
  
  # Client configuration
  # Vite proxy target for API calls (use K8s internal DNS)
  VITE_PROXY_TARGET: http://backend-service:3000
  REACT_APP_API_URL: http://localhost:3000
