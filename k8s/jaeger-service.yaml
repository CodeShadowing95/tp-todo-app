apiVersion: v1
kind: Service
metadata:
  name: jaeger-service
  namespace: todo-app
spec:
  selector:
    app: jaeger
  ports:
  - port: 16686
    targetPort: 16686
    protocol: TCP
    name: ui
  - port: 4317
    targetPort: 4317
    protocol: TCP
    name: otlp-grpc
  - port: 4318
    targetPort: 4318
    protocol: TCP
    name: otlp-http
  type: ClusterIP
