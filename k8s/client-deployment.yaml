apiVersion: apps/v1
kind: Deployment
metadata:
  name: client-deployment
  namespace: todo-app
spec:
  replicas: 1
  selector:
    matchLabels:
      app: client
  template:
    metadata:
      labels:
        app: client
    spec:
      automountServiceAccountToken: false
      containers:
      - name: client
        image: todo-client:latest
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 5173
          name: http
        env:
        - name: VITE_PROXY_TARGET
          valueFrom:
            configMapKeyRef:
              name: app-config
              key: VITE_PROXY_TARGET
        - name: VITE_AUTH_PROXY_TARGET
          valueFrom:
            configMapKeyRef:
              name: app-config
              key: VITE_AUTH_PROXY_TARGET
        resources:
          requests:
            memory: "128Mi"
            cpu: "50m"
          limits:
            memory: "512Mi"
            cpu: "250m"
        livenessProbe:
          httpGet:
            path: /
            port: 5173
          initialDelaySeconds: 60
          periodSeconds: 30
          timeoutSeconds: 5
          failureThreshold: 5
        readinessProbe:
          httpGet:
            path: /
            port: 5173
          initialDelaySeconds: 40
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
