name: CI
on: [push, pull_request]
env:
  FORCE_COLOR: 2

jobs:
  trivy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@692973e3d937129bcbf40652eb9f2f61becf3332

      - name: Trivy filesystem scan summary
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          format: table
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          scanners: vuln
          hide-progress: true
          skip-dirs: .terraform,node_modules
          exit-code: 0

      - name: Trivy filesystem scan SARIF
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          format: sarif
          output: trivy-results.sarif
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          scanners: vuln
          hide-progress: true
          skip-dirs: .terraform,node_modules
          exit-code: 1

      - name: Upload Trivy SARIF
        if: always()
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: trivy-results.sarif

  trivy-images:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - image_name: backend
            dockerfile: apps/backend/Dockerfile.scan
            context: .
          - image_name: auth
            dockerfile: apps/auth/Dockerfile.scan
            context: .
          - image_name: client
            dockerfile: apps/client/Dockerfile.scan
            context: .
          - image_name: gateway
            dockerfile: gateway/Dockerfile
            context: .
    steps:
      - uses: actions/checkout@692973e3d937129bcbf40652eb9f2f61becf3332

      - name: Build image
        run: docker build -t todo-${{ matrix.image_name }}:scan -f ${{ matrix.dockerfile }} ${{ matrix.context }}

      - name: Trivy image scan summary
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: todo-${{ matrix.image_name }}:scan
          format: table
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          scanners: vuln
          hide-progress: true
          exit-code: 0

      - name: Trivy image scan SARIF
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: todo-${{ matrix.image_name }}:scan
          format: sarif
          output: trivy-image-results.sarif
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          scanners: vuln
          hide-progress: true
          exit-code: 1

      - name: Upload Trivy image SARIF
        if: always()
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: trivy-image-results.sarif
          category: trivy-image-${{ matrix.image_name }}

  ci-backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@692973e3d937129bcbf40652eb9f2f61becf3332
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 20
          cache: npm
      - run: npm ci --ignore-scripts

      - name: Format check
        run: npm run format-check
        working-directory: apps/backend

      - name: Build
        run: npm run build
        working-directory: apps/backend

      - name: Tests
        run: npm test
        working-directory: apps/backend

  ci-client:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@692973e3d937129bcbf40652eb9f2f61becf3332
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 20
          cache: npm

      - run: npm ci --ignore-scripts

      - name: Format check
        run: npm run format-check
        working-directory: apps/client

      - name: Lint
        run: npm run lint
        working-directory: apps/client

      - name: Tests
        run: npm run test
        working-directory: apps/client

      - name: Build
        run: npm run build
        working-directory: apps/client

