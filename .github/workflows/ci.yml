name: CI
on: [push, pull_request]
env:
  FORCE_COLOR: 2

jobs:
  trivy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@692973e3d937129bcbf40652eb9f2f61becf3332

      - name: Trivy filesystem scan summary
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          format: table
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          scanners: vuln
          hide-progress: true
          skip-dirs: .terraform,node_modules
          exit-code: 0

      - name: Trivy filesystem scan SARIF
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          format: sarif
          output: trivy-results.sarif
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          scanners: vuln
          hide-progress: true
          skip-dirs: .terraform,node_modules
          exit-code: 1

      - name: Upload Trivy SARIF
        if: always()
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: trivy-results.sarif

  trivy-images:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - image_name: backend
            dockerfile: apps/backend/Dockerfile.scan
            context: .
          - image_name: auth
            dockerfile: apps/auth/Dockerfile.scan
            context: .
          - image_name: client
            dockerfile: apps/client/Dockerfile.scan
            context: .
          - image_name: gateway
            dockerfile: gateway/Dockerfile
            context: .
    steps:
      - uses: actions/checkout@692973e3d937129bcbf40652eb9f2f61becf3332

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image
        run: docker buildx build --pull --load -t todo-${{ matrix.image_name }}:scan -f ${{ matrix.dockerfile }} ${{ matrix.context }}

      - name: Debug image metadata
        if: matrix.image_name == 'auth' || matrix.image_name == 'backend'
        shell: bash
        run: |
          docker image inspect todo-${{ matrix.image_name }}:scan --format '{{json .RepoTags}}'
          docker image inspect todo-${{ matrix.image_name }}:scan --format '{{json .RepoDigests}}'
          docker image inspect todo-${{ matrix.image_name }}:scan --format '{{.Id}}'
          docker history --no-trunc todo-${{ matrix.image_name }}:scan

      - name: Debug Trivy CLI SARIF
        if: matrix.image_name == 'auth' || matrix.image_name == 'backend'
        shell: bash
        run: |
          set +e
          docker run --rm \
            -v /var/run/docker.sock:/var/run/docker.sock \
            -v "$PWD:/work" \
            -w /work \
            aquasec/trivy:0.70.0 image \
            --format sarif \
            --output trivy-image-debug.sarif \
            --severity HIGH,CRITICAL \
            --ignore-unfixed \
            --scanners vuln \
            --exit-code 1 \
            todo-${{ matrix.image_name }}:scan
          status=$?
          echo "trivy_cli_exit_code=$status"
          python - <<'PY'
          import json
          from pathlib import Path

          sarif_path = Path("trivy-image-debug.sarif")
          if not sarif_path.exists():
              print("sarif_exists=false")
              raise SystemExit(0)

          data = json.loads(sarif_path.read_text(encoding="utf-8"))
          runs = data.get("runs", [])
          results = runs[0].get("results", []) if runs else []
          rules = runs[0].get("tool", {}).get("driver", {}).get("rules", []) if runs else []
          print(f"sarif_exists=true")
          print(f"sarif_runs={len(runs)}")
          print(f"sarif_rules={len(rules)}")
          print(f"sarif_results={len(results)}")
          for result in results[:10]:
              print("sarif_result_ruleId=", result.get("ruleId"))
          PY
          exit 0

      - name: Trivy image scan summary
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: todo-${{ matrix.image_name }}:scan
          format: table
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          scanners: vuln
          hide-progress: true
          exit-code: 0

      - name: Trivy image scan SARIF
        shell: bash
        run: |
          docker run --rm \
            -v /var/run/docker.sock:/var/run/docker.sock \
            -v "$PWD:/work" \
            -w /work \
            aquasec/trivy:0.70.0 image \
            --format sarif \
            --output trivy-image-results.sarif \
            --severity HIGH,CRITICAL \
            --ignore-unfixed \
            --scanners vuln \
            --skip-version-check \
            --exit-code 1 \
            todo-${{ matrix.image_name }}:scan

      - name: Upload Trivy image SARIF
        if: always()
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: trivy-image-results.sarif
          category: trivy-image-${{ matrix.image_name }}

  ci-backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@692973e3d937129bcbf40652eb9f2f61becf3332
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 20
          cache: npm
      - run: npm ci --ignore-scripts

      - name: Format check
        run: npm run format-check
        working-directory: apps/backend

      - name: Build
        run: npm run build
        working-directory: apps/backend

      - name: Tests
        run: npm test
        working-directory: apps/backend

  ci-client:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@692973e3d937129bcbf40652eb9f2f61becf3332
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 20
          cache: npm

      - run: npm ci --ignore-scripts

      - name: Format check
        run: npm run format-check
        working-directory: apps/client

      - name: Lint
        run: npm run lint
        working-directory: apps/client

      - name: Tests
        run: npm run test
        working-directory: apps/client

      - name: Build
        run: npm run build
        working-directory: apps/client

