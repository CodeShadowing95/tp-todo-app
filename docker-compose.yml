services:
  backend:
    build:
      context: .
      dockerfile: apps/backend/Dockerfile
      target: development
    image: todo-backend:latest
    container_name: todo_backend
    restart: unless-stopped
    env_file:
      - ./apps/backend/.env
    environment:
      - REDIS_URL=redis://redis-task:6379
    depends_on:
      redis-task:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://localhost:3000/health"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  auth:
    build:
      context: .
      dockerfile: apps/auth/Dockerfile
      target: development
    image: todo-auth:latest
    container_name: todo_auth
    restart: unless-stopped
    env_file:
      - ./apps/auth/.env
    environment:
      - REDIS_URL=redis://redis-auth:6379
    depends_on:
      redis-auth:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://localhost:3001/health"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  client:
    build:
      context: ./apps/client
      dockerfile: Dockerfile
      target: development
    image: todo-client:latest
    container_name: todo_client
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
      auth:
        condition: service_healthy
    volumes:
      - ./apps/client:/app
      - /app/node_modules
    command: sh -c "npm install && npm run dev"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://127.0.0.1:5173"]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 45s

  redis-task:
    image: redis:7-alpine
    container_name: todo_redis_task
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

  redis-auth:
    image: redis:7-alpine
    container_name: todo_redis_auth
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

  gateway:
    build:
      context: .
      dockerfile: gateway/Dockerfile
    image: todo-gateway:latest
    container_name: todo_gateway
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
      auth:
        condition: service_healthy
      client:
        condition: service_healthy
    ports:
      - "8080:8080"
      - "8443:8443"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://127.0.0.1:8080/health"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

  prometheus:
    image: prom/prometheus:latest
    container_name: todo_prometheus
    restart: unless-stopped
    ports:
      - "9091:9090"
    volumes:
      - ./observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    depends_on:
      - backend
      - auth

  grafana:
    image: grafana/grafana:latest
    container_name: todo_grafana
    restart: unless-stopped
    ports:
      - "3003:3000"
    volumes:
      - grafana_data:/var/lib/grafana
    depends_on:
      - prometheus

volumes:
  grafana_data:
